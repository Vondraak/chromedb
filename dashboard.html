<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    :root{
      --tile-bg: rgba(10, 14, 20, 0.55);
      --tile-border: rgba(255, 255, 255, 0.12);
      --tile-hover: rgba(10, 14, 20, 0.75);
      --text: rgba(255, 255, 255, 0.92);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --radius: 7px;
    }
    *{ box-sizing: border-box; }
    html, body{
      height: 100%;
      margin: 0;
      background: #000;
      overscroll-behavior-y: none;
    }
    body{
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      position: relative;
      background: transparent;
    }
    body::before{
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: #000;
      background-image:
        radial-gradient(circle at 20% 70%, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.75) 100%),
        url("WCD_Tesselated_GoldSpace_NoLogo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .wrap{
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }
    .panel{
      width: min(1100px, 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      background: rgba(0,0,0,0.20);
      position: relative;
    }
    .grid{
      display: grid;
      gap: 9px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
    }
    .tile{
      display: grid;
      grid-template-columns: 60px 1fr;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--tile-border);
      background: var(--tile-bg);
      text-decoration: none;
      color: var(--text);
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .tile:hover{
      transform: translateY(-5px);
      background: var(--tile-hover);
      border-color: rgba(255,255,255,0.22);
    }
    .icon{
      width: 60px;
      height: 60px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .icon img{
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: none;
    }
    .icon svg{
      width: 36px;
      height: 36px;
      display: block;
    }
    .name{
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .panel-corner-icon{
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -50%);
      width: 220px;
      height: auto;
      z-index: 5;
      pointer-events: none;
      /* shift the blue wordmark to gold */
      filter: hue-rotate(190deg) saturate(1.5) brightness(1.05);
    }
    @media (max-width: 600px){
      .panel-corner-icon{
        width: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <img src="icon.png" class="panel-corner-icon" alt="">
      <section class="grid">

        <!-- Row 1 -->
        <a class="tile" href="https://vondraak.github.io/Budget/" target="_blank">
          <div class="icon">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="cyberMoney" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#00f0ff"/>
                  <stop offset="55%" stop-color="#7b5cff"/>
                  <stop offset="100%" stop-color="#ff2fd0"/>
                </linearGradient>
                <filter id="cyberGlow" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="2.2" result="b"/>
                  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              <g font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="52" font-weight="700" text-anchor="middle">
                <text x="30.4" y="50" fill="#ff2fd0" opacity="0.55">$</text>
                <text x="33.6" y="50" fill="#00f0ff" opacity="0.55">$</text>
                <text x="32" y="50" fill="url(#cyberMoney)" filter="url(#cyberGlow)">$</text>
              </g>
              <rect x="6" y="25.5" width="52" height="1.6" fill="#0b0f16" opacity="0.85"/>
              <rect x="6" y="38" width="52" height="1.2" fill="#0b0f16" opacity="0.7"/>
            </svg>
          </div>
          <p class="name">Monthly Budget</p>
        </a>
        <a class="tile" href="https://vondraak.github.io/WTC/" target="_blank">
          <div class="icon"><img src="file_4.png" alt=""></div>
          <p class="name">WTC Invoicing</p>
        </a>
        <a class="tile" href="http://192.168.50.99/login" target="_blank">
          <div class="icon"><img src="https://www.google.com/s2/favicons?sz=64&domain=mainsail.xyz"
            onerror="this.onerror=null;this.src=&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'%3E%3Cpath d='M12 2 4 18h8V2zm2 6v10h6L14 8zM2 20h20v2H2v-2z'/%3E%3C/svg%3E&quot;"></div>
          <p class="name">Ender3v2</p>
        </a>

        <!-- Row 2 -->
        <a class="tile" href="https://admin.microsoft.com/" target="_blank">
          <div class="icon"><img src="https://www.google.com/s2/favicons?sz=64&domain=admin.microsoft.com"></div>
          <p class="name">M365 Admin</p>
        </a>
        <a class="tile" href="https://admin.exchange.microsoft.com/#/mailboxes" target="_blank">
          <div class="icon"><img src="https://www.google.com/s2/favicons?sz=64&domain=admin.exchange.microsoft.com"></div>
          <p class="name">Exchange</p>
        </a>
        <a class="tile" href="https://intune.microsoft.com/#home" target="_blank">
          <div class="icon"><img src="https://www.google.com/s2/favicons?sz=64&domain=intune.microsoft.com"></div>
          <p class="name">Intune</p>
        </a>

        <!-- Row 3 -->
        <a class="tile" href="https://messages.google.com/web/conversations" target="_blank">
          <div class="icon">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#5ea9ff"/>
                  <stop offset="100%" stop-color="#1a73e8"/>
                </linearGradient>
              </defs>
              <path fill="url(#bubbleGrad)" d="M32 8C17.6 8 6 17.4 6 29c0 6.6 3.8 12.4 9.7 16.2-.6 4.1-2.4 7.6-5 10.2-.7.7-.2 1.9.8 1.8 6.3-.6 11.3-3 14.7-5.6 1.9.3 3.8.5 5.8.5 14.4 0 26-9.4 26-21S46.4 8 32 8z"/>
              <circle cx="22" cy="29" r="3.1" fill="#0b0f16" opacity="0.9"/>
              <circle cx="32" cy="29" r="3.1" fill="#0b0f16" opacity="0.9"/>
              <circle cx="42" cy="29" r="3.1" fill="#0b0f16" opacity="0.9"/>
            </svg>
          </div>
          <p class="name">Messages</p>
        </a>
        <a class="tile" href="https://github.com/" target="_blank">
          <div class="icon"><img src="https://www.google.com/s2/favicons?sz=64&domain=github.com"></div>
          <p class="name">GitHub</p>
        </a>
        <a class="tile" href="http://192.168.50.161/Dashboard" target="_blank">
          <div class="icon"><img src="https://www.google.com/s2/favicons?sz=64&domain=unraid.net"
            onerror="this.onerror=null;this.src=&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f15a2c'%3E%3Crect x='3' y='4' width='18' height='4' rx='1'/%3E%3Crect x='3' y='10' width='18' height='4' rx='1' fill-opacity='0.75'/%3E%3Crect x='3' y='16' width='18' height='4' rx='1'/%3E%3C/svg%3E&quot;"></div>
          <p class="name">UNRaid Server</p>
        </a>

      </section>
    </main>
  </div>
</body>
</html>
